server:
  port: 9100

spring:
  application:
    name: ledger-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      use_big_decimal_for_floats: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://securetoken.google.com/${FIREBASE_PROJECT_ID:pregsledger}"
          audiences: "${FIREBASE_PROJECT_ID:pregsledger}"

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
