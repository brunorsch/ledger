server:
  port: 9100

spring:
  application:
    name: ledger-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      use_big_decimal_for_floats: true

management:
  endpoints:
    web:
      exposure:
        include: health,info